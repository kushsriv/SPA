[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcast"
version = "1.0.0"
description = "Budget-aware federated stream clustering over Apache Kafka under non-IID data and network constraints"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "confluent-kafka>=2.6", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.scripts]
fedcast = "fedcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
